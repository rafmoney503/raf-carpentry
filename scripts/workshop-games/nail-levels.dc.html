<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nail Pop levels</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
a{text-decoration:none;color:inherit}
@keyframes nl-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes nl-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,138,91,.6)}50%{box-shadow:0 0 0 7px rgba(255,138,91,0)}}
@keyframes nl-pop{0%,70%,100%{transform:translate(-50%,-50%) scale(1)}80%{transform:translate(-50%,-50%) scale(1.15)}}
.nl-card{transition:transform .12s ease, border-color .12s ease}
.nl-card:hover{transform:translateY(-2px)}
.nl-shake{animation:nl-shake .35s ease-out}
.nl-now{animation:nl-pulse 1.8s ease-in-out infinite}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 6px 16px 14px; background-color: #121518; background-image: linear-gradient(rgba(127,155,255,0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(127,155,255,0.12) 1px, transparent 1px); background-size: 80px 80px; color: #f4f1ea; font-family: Geist, system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none">

  <header style="display: flex; align-items: center; gap: 6px; height: 50px">
    <a href="#/" aria-label="Back to the games" style="width: 44px; height: 44px; margin-left: -10px; display: grid; place-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1">
      <div class="mono" style="font-size: 10.5px; letter-spacing: 0.12em; color: #ff8a5b">NAIL POP</div>
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 20px; font-weight: 760; letter-spacing: -0.02em">Round the house</div>
    </div>
    <div style="text-align: right">
      <div class="mono" style="font-size: 10.5px; color: #a3abb3">STARS</div>
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 18px; font-weight: 760"><span style="color: #f2c94c">★</span> {{ total }} <span style="font-size: 13px; color: #a3abb3">/ 27</span></div>
    </div>
  </header>

  <svg width="358" height="372" viewBox="0 0 358 372" style="position: absolute; left: 16px; top: 62px" aria-hidden="true">
    <defs>
      <pattern id="nl-oak" width="14" height="8" patternUnits="userSpaceOnUse"><rect width="14" height="8" fill="#9c7448"></rect><rect x="13" width="1" height="8" fill="rgba(0,0,0,0.3)"></rect></pattern>
      <pattern id="nl-fence" width="9" height="10" patternUnits="userSpaceOnUse"><rect width="9" height="10" fill="#8a6c4a"></rect><rect x="8" width="1" height="10" fill="rgba(0,0,0,0.35)"></rect></pattern>
    </defs>
    <rect x="0" y="352" width="358" height="20" fill="#2a3a22"></rect>
    <path d="M0 352 H358" stroke="#5d7a3a" stroke-width="2"></path>
    <rect x="150" y="60" width="18" height="60" fill="#3b2f28" stroke="rgba(244,241,234,0.5)" stroke-width="1.2"></rect>
    <path d="M2 192 L109 42 L216 192 Z" fill="#1f252b" stroke="rgba(244,241,234,0.75)" stroke-width="1.5"></path>
    <path d="M20 180 L109 56 L198 180" fill="none" stroke="rgba(244,241,234,0.12)" stroke-width="1"></path>
    <path d="M13 175 L109 41 M20 182 L109 58 M27 189 L109 75" stroke="rgba(201,164,110,0.55)" stroke-width="1.6"></path>
    <path d="M40 188 L109 92 L178 188 Z" fill="rgba(210,185,140,0.10)" stroke="rgba(244,241,234,0.25)" stroke-dasharray="3 3" stroke-width="1"></path>
    <rect x="58" y="182" width="102" height="6" fill="#c8b083" opacity="0.8"></rect>
    <rect x="12" y="192" width="194" height="160" fill="#1a1f24" stroke="rgba(244,241,234,0.75)" stroke-width="1.5"></rect>
    <path d="M12 272 H206" stroke="rgba(244,241,234,0.55)" stroke-width="2"></path>
    <rect x="12" y="344" width="104" height="8" fill="url(#nl-oak)"></rect>
    <rect x="22" y="300" width="22" height="44" fill="#2c3b52" stroke="rgba(244,241,234,0.45)" stroke-width="1"></rect>
    <circle cx="40" cy="324" r="1.6" fill="#f2c94c"></circle>
    <path d="M118 352 v-12 h13 v-12 h13 v-13 h13 v-12 h13 v-13 h13 v-12 h12 v-6" fill="none" stroke="#c99a62" stroke-width="2.4"></path>
    <path d="M118 352 L196 276" stroke="rgba(201,154,98,0.35)" stroke-width="1"></path>
    <rect x="36" y="210" width="44" height="62" fill="#e6dccb" stroke="rgba(22,25,28,0.6)" stroke-width="1"></rect>
    <path d="M58 212 V270 M54 240 v6 M62 240 v6" stroke="rgba(22,25,28,0.6)" stroke-width="1.2"></path>
    <rect x="132" y="206" width="44" height="36" fill="#22344d" stroke="rgba(244,241,234,0.5)" stroke-width="1.2"></rect>
    <path d="M154 206 V242 M132 224 H176" stroke="rgba(244,241,234,0.4)" stroke-width="1"></path>
    <rect x="222" y="268" width="134" height="84" fill="url(#nl-fence)"></rect>
    <path d="M222 268 H356 M222 290 H356 M222 336 H356" stroke="rgba(0,0,0,0.25)" stroke-width="1"></path>
    <path d="M280 296 L316 270 L352 296 Z" fill="#4a3a2e" stroke="rgba(244,241,234,0.6)" stroke-width="1.2"></path>
    <rect x="286" y="294" width="60" height="58" fill="#6b5236" stroke="rgba(244,241,234,0.5)" stroke-width="1.2"></rect>
    <rect x="306" y="314" width="20" height="38" fill="#4c3a27" stroke="rgba(244,241,234,0.4)" stroke-width="1"></rect>
    <rect x="210" y="338" width="44" height="6" fill="#8a6a4f" stroke="rgba(0,0,0,0.35)" stroke-width="0.8"></rect>
    <path d="M214 344 v8 M250 344 v8" stroke="#6b5236" stroke-width="3"></path>
    <path d="M256 340 h26 M256 345 h26 M256 350 h26" stroke="#c6a77a" stroke-width="3"></path>
    <path d="M258 338 v14 M269 338 v14 M280 338 v14" stroke="#6b5236" stroke-width="2"></path>
  </svg>

  <sc-for list="{{ pins }}" as="p" hint-placeholder-count="9">
    <a href="#/nail" onClick="{{ p.go }}" class="{{ p.cls }}" style="position: absolute; left: {{ p.x }}px; top: {{ p.y }}px; width: 26px; height: 26px; transform: translate(-50%,-50%); border-radius: 50%; display: grid; place-items: center; background: {{ p.bg }}; color: {{ p.fg }}; border: 2px solid {{ p.ring }}; box-sizing: border-box; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,0.5)">{{ p.label }}</a>
  </sc-for>

  <div style="position: absolute; left: 16px; right: 16px; top: 444px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="9">
      <a href="#/nail" onClick="{{ c.go }}" class="{{ c.cls }}" style="display: block">
        <span class="nl-card" style="display: flex; flex-direction: column; height: 96px; box-sizing: border-box; padding: 9px 10px 8px; border-radius: 11px; background: rgba(27,32,37,0.94); border: 1px solid {{ c.border }}; opacity: {{ c.op }}">
          <span style="display: flex; justify-content: space-between; align-items: baseline">
            <span class="mono" style="font-size: 18px; font-weight: 700; color: {{ c.numC }}">{{ c.n }}</span>
            <span style="font-size: 12.5px; letter-spacing: 1px; color: #f2c94c">{{ c.stars }}</span>
          </span>
          <span style="margin-top: 3px; font-size: 13.5px; font-weight: 650; line-height: 1.2">{{ c.name }}</span>
          <span class="mono" style="margin-top: auto; font-size: 10px; color: {{ c.tagC }}">{{ c.tag }}</span>
        </span>
      </a>
    </sc-for>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #a3abb3">
    <span>A star on a level opens the next one.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.LEVELS = [
      { n: 1, name: 'Hallway floor', tag: 'Nails only', pin: [62, 318] },
      { n: 2, name: 'Garden decking', tag: 'Screws mixed in', pin: [228, 324] },
      { n: 3, name: 'Loft boarding', tag: 'Fast, gold nails', pin: [109, 150] },
      { n: 4, name: 'Stair treads', tag: 'Small targets', pin: [160, 312] },
      { n: 5, name: 'Fence panels', tag: 'Two at a time', pin: [246, 284] },
      { n: 6, name: 'Shed at night', tag: 'In the dark', pin: [316, 334] },
      { n: 7, name: 'Roof battens', tag: 'Lots, and fast', pin: [52, 112] },
      { n: 8, name: 'Pallet rush', tag: 'Three at a time', pin: [270, 326] },
      { n: 9, name: 'The whole house', tag: 'Everything at once', pin: [159, 44] },
    ];
    this.state = { stars: {}, cur: 1, all: false, shake: 0 };
  }
  load() {
    try {
      this.setState({
        stars: JSON.parse(localStorage.getItem('raf_games_stars_nail') || '{}') || {},
        cur: parseInt(localStorage.getItem('raf_games_level_nail') || '1', 10) || 1,
        all: localStorage.getItem('raf_games_open_all') === '1',
      });
    } catch (e) {}
  }
  componentDidMount() {
    this.load();
    this.onStore = () => this.load(); this.onVis = () => { if (!document.hidden) this.load(); };
    window.addEventListener('storage', this.onStore); document.addEventListener('visibilitychange', this.onVis); window.addEventListener('focus', this.onStore);
  }
  componentWillUnmount() { window.removeEventListener('storage', this.onStore); document.removeEventListener('visibilitychange', this.onVis); window.removeEventListener('focus', this.onStore); }
  ac() { try { if (!this._c) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this._c = new A(); } if (this._c.state === 'suspended') this._c.resume(); return this._c; } catch (e) { return null; } }
  tone(f, d, o) { o = o || {}; const c = this.ac(); if (!c) return; const t = c.currentTime + (o.at || 0), osc = c.createOscillator(), g = c.createGain(); osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t); if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d); g.gain.setValueAtTime(o.vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d); osc.connect(g).connect(c.destination); osc.start(t); osc.stop(t + d + 0.05); }
  renderVals() {
    const st = this.state;
    const open = (n) => st.all || n === 1 || (st.stars[n - 1] || 0) > 0;
    const go = (l, o) => (e) => {
      if (!o) { if (e) e.preventDefault(); this.tone(110, 0.15, { type: 'sawtooth', vol: 0.1 }); this.tone(104, 0.18, { type: 'sawtooth', vol: 0.1, at: 0.17 }); this.setState({ shake: 0 }); setTimeout(() => this.setState({ shake: l.n }), 16); return; }
      try { localStorage.setItem('raf_games_level_nail', String(l.n)); } catch (x) {}
      this.tone(1500, 0.05, { type: 'square', vol: 0.06 }); this.tone(150, 0.14, { to: 70, vol: 0.35 });
    };
    const pins = this.LEVELS.map((l) => {
      const o = open(l.n), s = st.stars[l.n] || 0;
      return {
        x: 16 + l.pin[0], y: 62 + l.pin[1], label: o ? String(l.n) : '·',
        bg: o ? (s === 3 ? '#6fcf97' : '#16191c') : '#2a3037', fg: o ? (s === 3 ? '#0e1114' : '#f4f1ea') : '#7d858d',
        ring: o ? (s ? (s === 3 ? '#0e1114' : '#f2c94c') : '#ff8a5b') : '#3a4047',
        cls: (st.cur === l.n ? 'nl-now' : '') + (st.shake === l.n ? ' nl-shake' : ''), go: go(l, o),
      };
    });
    const cards = this.LEVELS.map((l) => {
      const o = open(l.n), s = st.stars[l.n] || 0;
      return {
        n: l.n, name: l.name, stars: o ? '★★★'.slice(0, s) + '☆☆☆'.slice(0, 3 - s) : '',
        tag: o ? l.tag : 'Needs a star on ' + (l.n - 1), tagC: o ? '#a3abb3' : '#7d858d', numC: o ? '#ff8a5b' : '#5d636a',
        border: st.cur === l.n ? '#ff8a5b' : s === 3 ? 'rgba(111,207,151,0.6)' : 'rgba(244,241,234,0.12)', op: o ? 1 : 0.45,
        cls: st.shake === l.n ? 'nl-shake' : '', go: go(l, o),
      };
    });
    return {
      pins: pins, cards: cards, total: this.LEVELS.reduce((a, l) => a + (st.stars[l.n] || 0), 0),
      allLabel: st.all ? 'Lock them again' : 'Open all levels (mockup)',
      toggleAll: () => { const v = !this.state.all; try { localStorage.setItem('raf_games_open_all', v ? '1' : '0'); } catch (e) {} this.setState({ all: v }); },
    };
  }
}
</script>
</body>
</html>
